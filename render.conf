// Rendering and post-processing configuration

// Anti-aliasing settings
fxaa.enabled: true;

// SSAO settings
ssao.enabled: true;
ssao.samples: 20;
ssao.radius: 0.15;
ssao.power: 10.0;
ssao.denoise: 1.0;
ssao.denoiseDepthAware: false;
ssao.occlusionBufferDetail: 0.33;

// Glow settings
glow.enabled: true;
glow.viewScale: 0.33;
glow.threshold: 0.0;
glow.intensity: 0.1;
glow.radius: 10;

// HDR settings
hdr.tonemapper: "AgX_Punchy";
hdr.exposure: 1.0;
hdr.autoexposure: true;
hdr.keyValue: 0.2;
hdr.exposureAdaptationSpeed: 2.0;

// Vignetting settings
vignette.enabled: true;
vignette.strength: 0.5;
vignette.size: [0.5, 0.3];
vignette.roundness: 1.0;
vignette.feathering: 0.4;

// Motion blur settings
motionBlur.enabled: true;
motionBlur.samples: 16;
motionBlur.framerate: 24;
motionBlur.randomness: 0.2;
motionBlur.minDistance: 0.01;
motionBlur.maxDistance: 1.0;
motionBlur.radialBlurAmount: 0.0;

// Lens distortion settings
lensDistortion.enabled: true;
lensDistortion.scale: 0.95;
lensDistortion.dispersion: 0.04;

// Depth of Field settings
dof.enabled: false;
dof.autofocus: true;
dof.focalDepth: 1.0;
dof.focalLength: 5.0;
dof.fStop: 16.0;
dof.manual: false;
dof.nearStart: 2.0;
dof.nearDistance: 1.0;
dof.farStart: 3.0;
dof.farDistance: 100.0;
dof.circleOfConfusion: 0.03;
dof.pentagonBokeh: false;
dof.pentagonBokehFeather: 0.4;

// Film Grain settings
filmGrain.enabled: true;
filmGrain.colored: true;

// Color correction settings
cc.brightness: 0.0;
cc.contrast: 1.0;
cc.saturation: 1.0;

// LUT color grading settings
lut.enabled: true;
lut.file: "assets/lut/default.png";

// Sharpening settings
sharpening.enabled: true;
sharpening.strength: 0.5;

// Pixelization settings
pixelization.enabled: false;
pixelization.pixelSize: 1;
